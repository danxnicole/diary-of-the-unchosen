<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c8cdd4" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Archer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Cinematic animation of an archer releasing an arrow into a target"></canvas>
      <div class="ui" aria-live="polite">
        <button id="replay" type="button" class="replay" hidden>
          <span class="replay__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" stroke-linecap="round" />
              <path d="M4 4.5v4.2h4.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          Replay
        </button>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
